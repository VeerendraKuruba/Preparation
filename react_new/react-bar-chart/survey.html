<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Survey List</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: sans-serif; background: #f0f2f5; margin: 0; }
    .header { background: #fff; padding: 1rem 1.5rem; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; gap: 1rem; }
    .header h1 { margin: 0; font-size: 1.2rem; }
    .content { max-width: 900px; margin: 2rem auto; padding: 0 1.5rem; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
    th, td { padding: 0.8rem 1rem; text-align: left; border-bottom: 1px solid #f1f5f9; }
    th { background: #f8fafc; font-size: 0.75rem; text-transform: uppercase; color: #64748b; }
    .badge { padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
    .active { background: #dcfce7; color: #166534; }
    .closed { background: #f1f5f9; color: #475569; }
    button { background: #2563eb; color: #fff; border: none; padding: 0.4rem 0.9rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const SURVEYS = [
      { id: 1, title: 'Customer Satisfaction Q1', responses: 342, status: 'Active' },
      { id: 2, title: 'Product Feedback 2024',    responses: 128, status: 'Closed' },
      { id: 3, title: 'Employee Engagement',       responses: 89,  status: 'Active' },
      { id: 4, title: 'NPS Survey March',          responses: 512, status: 'Closed' },
    ];

    function SurveyRow({ survey }) {
      return (
        <tr>
          <td>{survey.title}</td>
          <td>{survey.responses}</td>
          <td>
            <span className={`badge ${survey.status === 'Active' ? 'active' : 'closed'}`}>
              {survey.status}
            </span>
          </td>
          <td><button>View</button></td>
        </tr>
      );
    }

    function SurveyTable({ surveys }) {
      return (
        <table>
          <thead>
            <tr>
              <th>Title</th>
              <th>Responses</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            {surveys.map(s => <SurveyRow key={s.id} survey={s} />)}
          </tbody>
        </table>
      );
    }

    function App() {
      const [surveys] = useState(SURVEYS);

      return (
        <div>
          <div className="header">
            <h1>SurveyMonkey</h1>
            <button>+ Create Survey</button>
          </div>
          <div className="content">
            <SurveyTable surveys={surveys} />
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
